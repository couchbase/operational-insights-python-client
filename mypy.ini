[mypy]
exclude = (?x)(
    setup\.py$
    | ci_scripts/
    | docs/
    | performer/
    | tests/utils/
    )

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-ijson.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-tests.utils.*]
follow_imports = skip
