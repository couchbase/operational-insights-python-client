[mypy]
# lowest supported Python, so typeshed flags newer stdlib APIs even though CI no longer runs 3.10
python_version = 3.10
exclude = (?x)(
    setup\.py$
    | ci_scripts/
    | docs/
    | performer/
    | tests/utils/
    )

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-ijson.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-tests.utils.*]
follow_imports = skip
