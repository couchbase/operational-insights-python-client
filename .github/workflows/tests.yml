name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      is_release:
        description: "Set to true if a release version."
        required: true
        default: false
        type: boolean
      sha:
        description: "The git SHA to use for release.  Only set if needing to publish"
        required: false
        default: ""
        type: string
      version:
        description: "The Release version.  Allowed format: x.y.z[-alphaN | -betaN | -rcN | -devN | -postN]"
        required: false
        default: ""
        type: string
      config:
        description: "JSON object deep-merged over the CI config (CBCI_CONFIG_OVERRIDE). Lists replace, not append. Example: {\"support\":{\"python_versions\":[\"3.15\"]}}"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      is_release:
        description: "Set to true if a release version."
        required: true
        default: false
        type: boolean
      sha:
        description: "The git SHA to use for release.  Only set if needing to publish"
        required: false
        default: ""
        type: string
      version:
        description: "The Release version.  Allowed format: x.y.z[-alphaN | -betaN | -rcN | -devN | -postN]"
        required: false
        default: ""
        type: string
      config:
        description: "JSON object deep-merged over the CI config (CBCI_CONFIG_OVERRIDE). Lists replace, not append. Example: {\"support\":{\"python_versions\":[\"3.15\"]}}"
        required: false
        default: ""
        type: string
    outputs:
      workflow_run_id:
        description: "The workflow run ID"
        value: ${{ github.run_id }}

env:
  CBCI_PROJECT_TYPE: "ANALYTICS"
  # Must match support.default_python in the CI-core's ci-config-pycbac.yaml; gha.py fails
  # the run if they disagree. Kept here because a GHA expression cannot call into Python and
  # the single-node jobs below need it for actions/setup-python.
  CBCI_DEFAULT_PYTHON: "3.10"
  # The support matrix (python versions, platforms per arch) is NOT here any more. It lives
  # in the CI-core's ci-config-pycbac.yaml, which is the only thing that reads it now, and
  # keeping a second copy meant a run could fan out over versions this file did not list.
  # Override a run with the `config` input (CBCI_CONFIG_OVERRIDE below).
  CBCI_DEFAULT_LINUX_X86_64_PLATFORM: "ubuntu-24.04"
  CBCI_DEFAULT_LINUX_ARM64_PLATFORM: "ubuntu-24.04-arm"
  CBCI_DEFAULT_MACOS_X86_64_PLATFORM: "macos-15-intel"
  CBCI_DEFAULT_MACOS_ARM64_PLATFORM: "macos-15"
  CBCI_DEFAULT_WINDOWS_PLATFORM: "windows-2022"
  CBCI_DEFAULT_LINUX_CONTAINER: "slim-bookworm"
  CBCI_DEFAULT_ALPINE_CONTAINER: "alpine"
  CBCI_CBDINO_VERSION: "v0.0.128"
  # The workflow_dispatch / workflow_call `config` input, deep-merged by the CI core over
  # ci-config-pycbac.yaml. Set once here so every job that loads the config sees it.
  CBCI_CONFIG_OVERRIDE: ${{ inputs.config }}
  CI_SCRIPTS_URL: "https://raw.githubusercontent.com/couchbaselabs/sdkbuild-jenkinsfiles/master/python/ci_scripts_v2"

jobs:
  default-linux-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.set_runner.outputs.runner }}
    steps:
      - id: set_runner
        run: echo "runner=${{ env.CBCI_DEFAULT_LINUX_X86_64_PLATFORM }}" >> $GITHUB_OUTPUT

  ci-scripts:
    needs: default-linux-runner
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      # bootstrap.sh is the ONLY file named here. It fetches the rest of the CI core at a
      # pinned ref and verifies every file's sha256 before anything runs, so adding a core
      # file never needs an edit in this repo.
      - name: Bootstrap CI core
        env:
          CBCI_DEST: ci_scripts
        run: |
          curl -fsSL ${CI_SCRIPTS_URL}/bootstrap.sh -o bootstrap.sh
          chmod +x bootstrap.sh
          ./bootstrap.sh
          ls -alh ci_scripts
      - name: Upload CI scripts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: ci_scripts_tests
          path: |
            ci_scripts/

  validate-input:
    needs: [ci-scripts, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    env:
      CBCI_IS_RELEASE: ${{ inputs.is_release }}
      CBCI_SHA: ${{ inputs.sha }}
      CBCI_VERSION: ${{ inputs.version }}
    steps:
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_tests
          path: ci_scripts
      - name: Verify Scripts
        run: |
          ls -alh ci_scripts
          chmod +x ci_scripts/tasks.sh
          ls -alh ci_scripts
      - name: Install engine dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Display workflow info
        run: |
          ./ci_scripts/tasks.sh display-info
      - name: Validate workflow info
        run: |
          python3 ./ci_scripts/gha.py validate-input '${{ github.workflow }}'

  setup:
    needs: [validate-input, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    outputs:
      stage_matrices: ${{ steps.build_matrices.outputs.stage_matrices }}
    steps:
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_tests
          path: ci_scripts
      - name: Enable CI Scripts
        run: |
          chmod +x ci_scripts/tasks.sh
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install engine dependency
        run: python -m pip install --quiet pyyaml
      - name: Build stage matrices
        id: build_matrices
        run: |
          exit_code=0
          STAGE_MATRICES=$(python3 ./ci_scripts/gha.py matrices) || exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Failed to obtain stage matrices."
            exit 1
          fi
          stage_matrices_json=$(jq -cn --argjson matrices "$STAGE_MATRICES" '$matrices')
          echo "STAGE_MATRICES_JSON=$stage_matrices_json"
          echo "stage_matrices=$stage_matrices_json" >> "$GITHUB_OUTPUT"

  confirm-matrices:
    needs: [setup, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      - name: Alpine Test Unit Stage
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.has_alpine }}
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_unit.alpine) }}"
      - name: Linux Test Unit Stage
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.has_linux }}
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_unit.linux) }}"
      - name: Macos Test Unit Stage
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.has_macos }}
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_unit.macos) }}"
      - name: Windows Test Unit Stage
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.has_windows }}
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_unit.windows) }}"
      - name: Unit Test Commands
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest) }}"
      - name: Integration Test Commands
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_integration.pytest) }}"
      - name: Linux cbdino Stage
        if: >-
          ${{ fromJson(needs.setup.outputs.stage_matrices).test_integration.has_linux_cbdino
              && !fromJson(needs.setup.outputs.stage_matrices).test_integration.skip_cbdino }}
        run: |
          echo cbdino config:
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_integration.cbdino_config) }}"
          echo cbdino linux:
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_integration.linux_cbdino) }}"
      - name: Linux Integration Stage
        if: >-
          ${{ fromJson(needs.setup.outputs.stage_matrices).test_integration.has_linux
              && !fromJson(needs.setup.outputs.stage_matrices).test_integration.skip_integration }}
        run: |
          echo "${{ toJson(fromJson(needs.setup.outputs.stage_matrices).test_integration.test_config) }}"

  test-setup:
    needs: [confirm-matrices, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      - name: Checkout (with SHA)
        if: inputs.sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Checkout (no SHA)
        if: inputs.sha == ''
        uses: actions/checkout@v7
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_tests
          path: ci_scripts
      - name: Enable CI Scripts
        run: |
          chmod +x ci_scripts/tasks.sh
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install engine dependency
        run: python -m pip install --quiet pyyaml
      - name: Build test setup
        env:
          # Build the tree at the workspace root, so it lands at ./pycbac_test the way the
          # v1 script placed it. tasks.sh otherwise stages it under .cbci_test, which is for
          # local reuse across repeated `tasks.sh test` runs.
          CBCI_TEST_DIR: "."
        run: |
          ./ci_scripts/tasks.sh test-setup
      - name: Build cbdinocluster definition
        run: |
          # The cluster def-file rides along inside the test-setup artifact, because the job
          # that allocates the cluster downloads that artifact and allocates from its
          # directory. Adapter work, not core: cbdinocluster is GHA's realization of the
          # neutral test.integration spec (Jenkins uses cbdyncluster).
          python3 ./ci_scripts/gha.py cbdino-config pycbac_test
      - name: Confirm test setup
        run: |
          echo "pycbac_test/cluster_def.yaml contents:"
          cat pycbac_test/cluster_def.yaml
          echo "pycbac_test directory contents:"
          ls -alh pycbac_test
          echo "pycbac_test/acb/tests contents:"
          ls -alh pycbac_test/acb/tests
          echo "pycbac_test/cb/tests contents:"
          ls -alh pycbac_test/cb/tests
          echo "pycbac_test/tests contents:"
          ls -alh pycbac_test/tests
          echo "pycbac_test/conftest.py contents:"
          cat pycbac_test/conftest.py
          echo "pycbac_test/requirements-test.txt contents:"
          cat pycbac_test/requirements-test.txt
          echo "pycbac_test/pytest.ini contents:"
          cat pycbac_test/pytest.ini
          echo "pycbac_test/tests/test_config.ini contents:"
          cat pycbac_test/tests/test_config.ini
      - name: Upload test setup
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: pycboi-test-setup
          path: |
            pycbac_test/

  lint:
    needs: [validate-input, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    env:
      CBCI_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout (with SHA)
        if: inputs.sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Checkout (no SHA)
        if: inputs.sha == ''
        uses: actions/checkout@v7
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_tests
          path: ci_scripts
      - name: Enable CI Scripts
        run: |
          chmod +x ci_scripts/tasks.sh
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install engine dependency
        run: python -m pip install --quiet pyyaml
      - name: Execute linting
        run: |
          ls -alh
          ./ci_scripts/tasks.sh lint

  sdist-wheel:
    needs: [lint, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    env:
      CBCI_VERSION: ${{ inputs.version }}
    outputs:
      sdist_name: ${{ steps.create_sdist.outputs.sdist_name }}
      wheel_name: ${{ steps.create_wheel.outputs.wheel_name }}
    steps:
      - name: Checkout (with SHA)
        if: inputs.sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          # Full history + tags, because the version is derived from `git describe`
          # (the CI core runs the version script with --update-pyproject for a
          # pure-Python project). A release run tags HEAD from CBCI_VERSION and would
          # describe fine even shallow; a non-release run has no tag to make, and a
          # depth-1 tagless fetch would stamp the artifacts 0.0.1.
          fetch-depth: 0
      - name: Checkout (no SHA)
        if: inputs.sha == ''
        uses: actions/checkout@v7
        with:
          # Full history + tags, because the version is derived from `git describe`
          # (the CI core runs the version script with --update-pyproject for a
          # pure-Python project). A release run tags HEAD from CBCI_VERSION and would
          # describe fine even shallow; a non-release run has no tag to make, and a
          # depth-1 tagless fetch would stamp the artifacts 0.0.1.
          fetch-depth: 0
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_tests
          path: ci_scripts
      - name: Enable CI Scripts
        run: |
          chmod +x ci_scripts/tasks.sh
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install engine dependency
        run: python -m pip install --quiet pyyaml
      - name: Create sdist
        id: create_sdist
        run: |
          ./ci_scripts/tasks.sh sdist
          # Read off disk, the same way the wheel name is read below. The v1 CI script had a
          # `get_sdist_name` verb for this; naming the artifact you just built is not CI-core
          # logic, and a helper that exists only to run `find` is a file to keep in sync.
          #
          # WITHOUT the .tar.gz suffix, matching what get_sdist_name emitted: the jobs that
          # consume this output append the extension themselves (`pip install
          # ${SDIST_NAME}.tar.gz`). The wheel name below keeps its extension, because its
          # consumers do not append one.
          sdist_path=$(find ./dist -name '*.tar.gz' | head -1)
          if [ -z "$sdist_path" ]; then
            echo "Failed to obtain sdist name: nothing matched ./dist/*.tar.gz"
            exit 1
          fi
          sdist_name=$(basename "$sdist_path" .tar.gz)
          echo "SDIST_NAME=$sdist_name"
          echo "sdist_name=$sdist_name" >> "$GITHUB_OUTPUT"
      - name: Create wheel
        id: create_wheel
        run: |
          ./ci_scripts/tasks.sh wheel
          # wheelhouse/dist, not ./dist. The CI core builds every wheel there, the
          # pure-Python one and the cibuildwheel ones alike, because that is the directory
          # validate's `--find-links` install reads. Only the sdist lands in ./dist.
          #
          # WITH the .whl suffix, unlike the sdist name above: the jobs that consume this
          # output hand it straight to `pip install`.
          wheel_path=$(find ./wheelhouse/dist -maxdepth 1 -name '*.whl' | head -1)
          if [ -z "$wheel_path" ]; then
            echo "Failed to obtain wheel name: nothing matched ./wheelhouse/dist/*.whl"
            exit 1
          fi
          wheel_name=$(basename "$wheel_path")
          echo "WHEEL_NAME=$wheel_name"
          echo "wheel_name=$wheel_name" >> "$GITHUB_OUTPUT"
      - name: Upload Python sdist
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: pycboi-artifact-sdist
          path: |
            ./dist/*.tar.gz
      - name: Upload Python wheel
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: pycboi-artifact-wheel
          path: |
            ./wheelhouse/dist/*.whl

  alpine-unit-tests:
    needs: [setup, test-setup, sdist-wheel, default-linux-runner]
    if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.has_alpine }}
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.alpine }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Download sdist
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_sdist_install }}
        uses: actions/download-artifact@v8
        with:
          name: pycboi-artifact-sdist
          path: pycboi
      - name: Download wheel
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_wheel_install }}
        uses: actions/download-artifact@v8
        with:
          name: pycboi-artifact-wheel
          path: pycboi
      - name: Download test setup
        uses: actions/download-artifact@v8
        with:
          name: pycboi-test-setup
          path: pycboi
      - name: Cache Docker image
        uses: actions/cache@v6
        with:
          path: /tmp/docker_python_image.tar # Path to store the image archive
          key: docker-image-python-${{ matrix.python-version }}-${{ env.CBCI_DEFAULT_ALPINE_CONTAINER }}
      - name: Pull and save image if not cached
        run: |
          if [ ! -f /tmp/docker_python_image.tar ]; then
            docker pull python:${{ matrix.python-version }}-${{ env.CBCI_DEFAULT_ALPINE_CONTAINER }}
            docker save python:${{ matrix.python-version }}-${{ env.CBCI_DEFAULT_ALPINE_CONTAINER }} -o /tmp/docker_python_image.tar
          fi
      - name: Load image if cached
        run: |
          if [ -f /tmp/docker_python_image.tar ]; then
            docker load -i /tmp/docker_python_image.tar
          fi
      - name: Run unit tests in docker via sdist install
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_sdist_install }}
        uses: addnab/docker-run-action@v3
        with:
          image: python:${{ matrix.python-version }}-${{ env.CBCI_DEFAULT_ALPINE_CONTAINER }}
          options: >-
            --platform linux/amd64
            -v ${{ github.workspace }}/pycboi:/pycboi
          run: |
            python -m pip install --upgrade pip setuptools wheel
            cd pycboi
            ls -alh
            python -m pip install -r requirements-test.txt
            SDIST_NAME=${{ needs.sdist-wheel.outputs.sdist_name }}
            echo "SDIST_NAME=$SDIST_NAME.tar.gz"
            python -m pip install ${SDIST_NAME}.tar.gz
            python -m pip list
            TEST_ACOUCHBASE_API=${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_acouchbase_api }}
            if [ "$TEST_ACOUCHBASE_API" = "true" ]; then
                PYTEST_ACB_CMD="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.acouchbase_cmd }}"
                PYTEST_ACB_OPTS="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.acouchbase_opts }}"
                PYTEST_CMD="$PYTEST_ACB_CMD $PYTEST_ACB_OPTS"
                echo "Running acouchbase tests: $PYTEST_CMD"
                eval "$PYTEST_CMD"
            fi
            TEST_COUCHBASE_API=${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_couchbase_api }}
            if [ "$TEST_COUCHBASE_API" = "true" ]; then
                PYTEST_CB_CMD="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.couchbase_cmd }}"
                PYTEST_CB_OPTS="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.couchbase_opts }}"
                PYTEST_CMD="$PYTEST_CB_CMD $PYTEST_CB_OPTS"
                echo "Running acouchbase tests: $PYTEST_CMD"
                eval "$PYTEST_CMD"
            fi
      - name: Run unit tests in docker via wheel install
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_wheel_install }}
        uses: addnab/docker-run-action@v3
        with:
          image: python:${{ matrix.python-version }}-${{ env.CBCI_DEFAULT_ALPINE_CONTAINER }}
          options: >-
            --platform linux/amd64
            -v ${{ github.workspace }}/pycboi:/pycboi
          run: |
            python -m pip install --upgrade pip setuptools wheel
            cd pycboi
            ls -alh
            python -m pip install -r requirements-test.txt
            WHEEL_NAME=${{ needs.sdist-wheel.outputs.wheel_name }}
            echo "WHEEL_NAME=$WHEEL_NAME"
            python -m pip install ${WHEEL_NAME}
            python -m pip list
            TEST_ACOUCHBASE_API=${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_acouchbase_api }}
            if [ "$TEST_ACOUCHBASE_API" = "true" ]; then
                PYTEST_ACB_CMD="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.acouchbase_cmd }}"
                PYTEST_ACB_OPTS="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.acouchbase_opts }}"
                PYTEST_CMD="$PYTEST_ACB_CMD $PYTEST_ACB_OPTS"
                echo "Running acouchbase tests: $PYTEST_CMD"
                eval "$PYTEST_CMD"
            fi
            TEST_COUCHBASE_API=${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_couchbase_api }}
            if [ "$TEST_COUCHBASE_API" = "true" ]; then
                PYTEST_CB_CMD="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.couchbase_cmd }}"
                PYTEST_CB_OPTS="${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.couchbase_opts }}"
                PYTEST_CMD="$PYTEST_CB_CMD $PYTEST_CB_OPTS"
                echo "Running couchbase tests: $PYTEST_CMD"
                eval "$PYTEST_CMD"
            fi

  linux-unit-tests:
    needs: [setup, test-setup, sdist-wheel]
    if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.has_linux }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.linux }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Download sdist
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_sdist_install }}
        uses: actions/download-artifact@v8
        with:
          name: pycboi-artifact-sdist
          path: pycboi
      - name: Download wheel
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_wheel_install }}
        uses: actions/download-artifact@v8
        with:
          name: pycboi-artifact-wheel
          path: pycboi
      - name: Download test setup
        uses: actions/download-artifact@v8
        with:
          name: pycboi-test-setup
          path: pycboi
      - name: Run unit tests via sdist install
        if: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_sdist_install }}
        env:
          PYTEST_ACB_CMD: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.acouchbase_cmd }}
          PYTEST_ACB_OPTS: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.acouchbase_opts }}
          PYTEST_CB_CMD: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.couchbase_cmd }}
          PYTEST_CB_OPTS: ${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.pytest.couchbase_opts }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd pycboi
          ls -alh
          python -m pip install -r requirements-test.txt
          SDIST_NAME=${{ needs.sdist-wheel.outputs.sdist_name }}
          echo "SDIST_NAME=$SDIST_NAME.tar.gz"
          python -m pip install ${SDIST_NAME}.tar.gz
          python -m pip list
          TEST_ACOUCHBASE_API=${{ fromJson(needs.setup.outputs.stage_matrices).test_unit.test_acouchbase_api }}
