name: publish

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The git SHA to use for release.  Only set if needing to publish"
        required: true
        default: ""
        type: string
      version:
        description: "The Release version.  Allowed format: x.y.z[-alphaN | -betaN | -rcN | -devN | -postN]"
        required: true
        default: ""
        type: string
      tests_run_id:
        description: "The workflow run ID of a tests workflow run.  Set if wanting to use artifacts from an already completed run."
        required: false
        default: ""
        type: string
      config:
        description: "JSON object deep-merged over the CI config (CBCI_CONFIG_OVERRIDE). Lists replace, not append. Example: {\"support\":{\"python_versions\":[\"3.15\"]}}"
        required: false
        default: ""
        type: string
      publish_target:
        description: "Which package index to publish to: both (TestPyPI, then PyPI), pypi, or test_pypi. test_pypi also skips the API docs."
        required: true
        default: both
        type: choice
        options:
          - both
          - pypi
          - test_pypi
      is_dry_run:
        description: "Set to true in order to do a publish dry-run."
        required: true
        default: false
        type: boolean
      skip_validation:
        description: "Set to true in order to skip validating the published packages."
        required: true
        default: false
        type: boolean

env:
  CBCI_PROJECT_TYPE: "ANALYTICS"
  # Must match support.default_python in the CI-core's ci-config-pycbac.yaml; gha.py fails
  # the run if they disagree. Kept here because a GHA expression cannot call into Python and
  # the single-node jobs below need it for actions/setup-python.
  CBCI_DEFAULT_PYTHON: "3.10"
  # The support matrix (python versions, platforms per arch) is NOT here any more. It lives
  # in the CI-core's ci-config-pycbac.yaml, which is the only thing that reads it now, and
  # keeping a second copy meant a run could fan out over versions this file did not list.
  # Override a run with the `config` input (CBCI_CONFIG_OVERRIDE below).
  CBCI_DEFAULT_LINUX_X86_64_PLATFORM: "ubuntu-24.04"
  CBCI_DEFAULT_LINUX_ARM64_PLATFORM: "ubuntu-24.04-arm"
  CBCI_DEFAULT_MACOS_X86_64_PLATFORM: "macos-15-intel"
  CBCI_DEFAULT_MACOS_ARM64_PLATFORM: "macos-15"
  CBCI_DEFAULT_WINDOWS_PLATFORM: "windows-2022"
  CBCI_DEFAULT_LINUX_CONTAINER: "slim-bookworm"
  CBCI_DEFAULT_ALPINE_CONTAINER: "alpine"
  CBCI_CBDINO_VERSION: "v0.0.128"
  # The workflow_dispatch / workflow_call `config` input, deep-merged by the CI core over
  # ci-config-pycbac.yaml. Set once here so every job that loads the config sees it.
  CBCI_CONFIG_OVERRIDE: ${{ inputs.config }}
  CI_SCRIPTS_URL: "https://raw.githubusercontent.com/couchbaselabs/sdkbuild-jenkinsfiles/master/python/ci_scripts_v2"

jobs:
  default-linux-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.set_runner.outputs.runner }}
    steps:
      - id: set_runner
        run: echo "runner=${{ env.CBCI_DEFAULT_LINUX_X86_64_PLATFORM }}" >> $GITHUB_OUTPUT

  ci-scripts:
    needs: default-linux-runner
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      # bootstrap.sh is the ONLY file named here. It fetches the rest of the CI core at a
      # pinned ref and verifies every file's sha256 before anything runs, so adding a core
      # file never needs an edit in this repo.
      - name: Bootstrap CI core
        env:
          CBCI_DEST: ci_scripts
        run: |
          curl -fsSL ${CI_SCRIPTS_URL}/bootstrap.sh -o bootstrap.sh
          chmod +x bootstrap.sh
          ./bootstrap.sh
          ls -alh ci_scripts
      - name: Upload CI scripts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: ci_scripts_publish
          path: |
            ci_scripts/

  validate-input:
    needs: [ci-scripts, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    env:
      CBCI_IS_RELEASE: true
      CBCI_SHA: ${{ inputs.sha }}
      CBCI_VERSION: ${{ inputs.version }}
    steps:
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_publish
          path: ci_scripts
      - name: Verify Scripts
        run: |
          ls -alh ci_scripts
          chmod +x ci_scripts/tasks.sh
          ls -alh ci_scripts
      - name: Install engine dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Display workflow info
        run: |
          ./ci_scripts/tasks.sh display-info
      - name: Validate workflow info
        run: |
          python3 ./ci_scripts/gha.py validate-input '${{ github.workflow }}'

  publish-config:
    needs: [validate-input, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    env:
      CBCI_IS_RELEASE: true
      CBCI_SHA: ${{ inputs.sha }}
      CBCI_VERSION: ${{ inputs.version }}
      CBCI_PUBLISH_DRY_RUN: ${{ inputs.is_dry_run }}
      CBCI_PUBLISH_TARGET: ${{ inputs.publish_target }}
      CBCI_TESTS_RUN_ID: ${{ inputs.tests_run_id }}
    outputs:
      publish_config: ${{ steps.set_config.outputs.publish_config }}
    steps:
      - name: Download CI scripts
        uses: actions/download-artifact@v8
        with:
          name: ci_scripts_publish
          path: ci_scripts
      - name: Enable CI Scripts
        run: |
          chmod +x ci_scripts/tasks.sh
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install engine dependency
        run: python -m pip install --quiet pyyaml
      - name: Set public config
        id: set_config
        run: |
          exit_code=0
          PUBLISH_CONFIG=$(python3 ./ci_scripts/gha.py publish-config) || exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Failed to obtain publish config."
            exit 1
          fi
          publish_config_json=$(jq -cn --argjson pubconfig "$PUBLISH_CONFIG" '$pubconfig')
          echo "PUBLISH_CONFIG_JSON=$publish_config_json"
          # A CI core that predates CBCI_PUBLISH_TARGET ignores it and returns both indexes.
          # Refuse that rather than publish to an index the dispatch excluded.
          if [ "$CBCI_PUBLISH_TARGET" = "test_pypi" ] && [ "$(jq -r '.publish_config.publish_pypi' <<< "$publish_config_json")" != "false" ]; then
            echo "publish_target=test_pypi but the publish config still enables PyPI; the CI core does not support publish_target."
            exit 1
          fi
          if [ "$CBCI_PUBLISH_TARGET" = "pypi" ] && [ "$(jq -r '.publish_config.publish_test_pypi' <<< "$publish_config_json")" != "false" ]; then
            echo "publish_target=pypi but the publish config still enables TestPyPI; the CI core does not support publish_target."
            exit 1
          fi
          echo "publish_config=$publish_config_json" >> "$GITHUB_OUTPUT"

  confirm-publish-config:
    needs: [publish-config, default-linux-runner]
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      - name: Publish Config
        run: |
          echo "${{ toJson(fromJson(needs.publish-config.outputs.publish_config)) }}"

  run-tests:
    needs: publish-config
    if: ${{ fromJson(needs.publish-config.outputs.publish_config).publish_config.tests_run_id == '' }}
    uses: ./.github/workflows/tests.yml
    with:
      is_release: true
      sha: ${{ inputs.sha && inputs.sha || '' }}
      version: ${{ inputs.version && inputs.version || '' }}
      config: ${{ inputs.config && inputs.config || '' }}

  set-tests-run-id:
    needs: [run-tests, default-linux-runner]
    if: >-
      ${{ !cancelled()
          && (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped') }}
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    outputs:
      tests_run_id: ${{ inputs.tests_run_id == '' && steps.save_tests_run_id.outputs.tests_run_id || inputs.tests_run_id }}
    steps:
      - name: Save tests_run_id
        if: ${{ inputs.tests_run_id == '' }}
        id: save_tests_run_id
        run: |
          echo "tests_run_id=${{ needs.run-tests.outputs.workflow_run_id }}" >> $GITHUB_OUTPUT

  upload-api-docs:
    needs: [publish-config, run-tests, default-linux-runner]
    if: >-
      ${{ !cancelled()
          && fromJson(needs.publish-config.outputs.publish_config).publish_config.publish_api_docs
          && (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped') }}
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      - name: Checkout (with SHA)
        if: inputs.sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Checkout (no SHA)
        if: inputs.sha == ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Set SDK git tag
        if: ${{ fromJson(needs.publish-config.outputs.publish_config).publish_config.set_git_tag != '' }}
        run: |
          git config user.name "Couchbase SDK Team"
          git config user.email "sdk_dev@couchbase.com"
          git tag -a $PYCBOI_VERSION -m "Release of client version $PYCBOI_VERSION"
        env:
          PYCBOI_VERSION: ${{ fromJson(needs.publish-config.outputs.publish_config).publish_config.set_git_tag }}
      - name: Set SDK version
        run: |
          python couchbase_operational_insights_version.py --mode make
      - name: Build API docs
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-sphinx.txt
          mkdir sphinx
          sphinx-build -M html ./docs ./sphinx
      - name: Upload Python API docs as artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: pycboi-api-docs
          path: sphinx/

  publish-test-pypi:
    needs: [publish-config, run-tests, set-tests-run-id, default-linux-runner]
    if: >-
      ${{ !cancelled()
          && fromJson(needs.publish-config.outputs.publish_config).publish_config.publish_test_pypi
          && (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped') }}
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    environment:
      name: publish
      url: https://pypi.org/p/couchbase-operational-insights
    permissions:
      # This permission is required for pypi's "trusted publisher" feature
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pycboi-artifact-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.set-tests-run-id.outputs.tests_run_id }}
          github-token: ${{ github.token }}
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel twine
      - name: Twine validate
        run: |
          ls -alh dist
          twine check dist/*
      - name: Publish package distributions to TestPyPI (dry run)
        if: ${{ inputs.is_dry_run }}
        run: |
          echo "Dry run set, not releasing to TestPyPI"
      - name: Publish package distributions to TestPyPI
        if: ${{ inputs.is_dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  validate-test-pypi:
    needs: publish-test-pypi
    if: >-
        ${{  !cancelled()
             && (needs.publish-test-pypi.result == 'success' && needs.publish-test-pypi.result != 'skipped')
             && inputs.skip_validation == false }}
    uses: ./.github/workflows/verify_release.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
      packaging_index: "TEST_PYPI"
      config: ${{ inputs.config && inputs.config || '' }}

  # When TestPyPI is enabled, PyPI waits for it to have published (and validated, unless
  # skip_validation is set). Accepting a `skipped` validate-test-pypi instead would let a FAILED
  # TestPyPI upload through, since validate-test-pypi is skipped in that case too.
  publish-pypi:
    needs: [publish-config, run-tests, set-tests-run-id, publish-test-pypi, validate-test-pypi, default-linux-runner]
    if: >-
      ${{ !cancelled()
          && fromJson(needs.publish-config.outputs.publish_config).publish_config.publish_pypi
          && (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped')
          && (!fromJson(needs.publish-config.outputs.publish_config).publish_config.publish_test_pypi
              || (needs.publish-test-pypi.result == 'success'
                  && (inputs.skip_validation || needs.validate-test-pypi.result == 'success'))) }}
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    environment:
      name: publish
      url: https://pypi.org/p/couchbase-operational-insights
    permissions:
      # This permission is required for pypi's "trusted publisher" feature
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pycboi-artifact-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.set-tests-run-id.outputs.tests_run_id }}
          github-token: ${{ github.token }}
      - name: Setup Python ${{ env.CBCI_DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}
      - name: Confirm Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel twine
      - name: Twine validate
        run: |
          ls -alh dist
          twine check dist/*
      - name: Publish package distributions to PyPI (dry run)
        if: ${{ inputs.is_dry_run }}
        run: |
          echo "Dry run set, not releasing to PyPI"
      - name: Publish package distributions to PyPI
        if: ${{ inputs.is_dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1

  validate-pypi:
    needs: publish-pypi
    if: >-
        ${{  !cancelled()
             && (needs.publish-pypi.result == 'success' && needs.publish-pypi.result != 'skipped')
             && inputs.skip_validation == false }}
    uses: ./.github/workflows/verify_release.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
      packaging_index: "PYPI"
      config: ${{ inputs.config && inputs.config || '' }}

  # The docs are for a version on PyPI, so they publish only after PyPI did (and validated,
  # unless skip_validation is set). Same reasoning as publish-pypi: a `skipped` validate-pypi
  # also covers a failed PyPI upload.
  publish-api-docs:
    needs: [publish-config, upload-api-docs, publish-pypi, validate-pypi, default-linux-runner]
    if: >-
      ${{ !cancelled()
          && fromJson(needs.publish-config.outputs.publish_config).publish_config.publish_api_docs
          && needs.upload-api-docs.result == 'success'
          && needs.publish-pypi.result == 'success'
          && (inputs.skip_validation || needs.validate-pypi.result == 'success') }}
    environment: publish
    permissions:
      id-token: write
      contents: read
    runs-on: ${{ needs.default-linux-runner.outputs.runner }}
    steps:
      - name: Download API docs
        uses: actions/download-artifact@v8
        with:
          name: pycboi-api-docs
      - name: Setup AWS Credentials
        if: ${{ inputs.is_dry_run == false }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::786014483886:role/SDK_GHA
          aws-region: us-west-1
      - name: Upload API docs to S3
        if: ${{ inputs.is_dry_run == false }}
        run: |
          ls -alh ./html
          aws s3 cp ./html s3://docs.couchbase.com/sdk-api/operational-insights-python-client-$SDK_VERSION/ --recursive --acl public-read
        env:
          SDK_VERSION: ${{ inputs.version }}
      - name: Upload API docs to S3 (dry run)
        if: ${{ inputs.is_dry_run }}
        run: |
          ls -alh ./html
          echo "aws s3 cp ./html s3://docs.couchbase.com/sdk-api/operational-insights-python-client-$SDK_VERSION/ --recursive --acl public-read"
        env:
          SDK_VERSION: ${{ inputs.version }}
