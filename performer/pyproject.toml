version = "1.0.0"
dependencies = [
    "couchbase-operational-insights",
    "googleapis-common-protos~=1.70.0",
    "grpcio-tools~=1.73.0",
    "mypy-protobuf~=3.6.0",
    "typing-extensions~=4.14.0",
]
requires-python = ">=3.10"
authors = [
  {name = "Couchbase, Inc.", email = "PythonPackage@couchbase.com"}
]
